name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (core + CLI + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMSX_BUILD_TESTS=ON -DMSX_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build -j

      - name: Tests
        run: |
          ctest --test-dir build --output-on-failure
          ./build/tools/msxtool/msxtool selftest

      - name: CLI round trip
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/roundtrip"
          mkdir -p "$W"
          T=./build/tools/msxtool/msxtool
          "$T" bas2cas examples/HELLO.bas -o "$W/HELLO.cas" --name HELLO
          "$T" cas2wav "$W/HELLO.cas" -o "$W/HELLO.wav" --baud 2400 --volume 60
          "$T" normalize "$W/HELLO.wav" -o "$W/HELLO.normalized.wav"
          "$T" wav2cas "$W/HELLO.normalized.wav" -o "$W/HELLO2.cas"
          "$T" cas2bas "$W/HELLO2.cas" -o "$W/HELLO2.bas"
          "$T" tokenize examples/HELLO.bas -o "$W/A.bin"
          "$T" tokenize "$W/HELLO2.bas" -o "$W/B.bin"
          cmp "$W/A.bin" "$W/B.bin"

  windows:
    name: Windows (MSVC, Win32)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build-win -G "Visual Studio 17 2022" -A Win32
          -DMSX_BUILD_WIN32=ON -DMSX_BUILD_TOOLS=ON -DMSX_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build-win --config Release

      - name: Tests
        shell: cmd
        run: |
          ctest --test-dir build-win -C Release --output-on-failure
          if errorlevel 1 exit /b 1
          build-win\tools\msxtool\Release\msxtool.exe selftest
          if errorlevel 1 exit /b 1

      - name: CLI round trip
        shell: cmd
        run: |
          set "W=%RUNNER_TEMP%\roundtrip"
          if not exist "%W%" mkdir "%W%"
          build-win\tools\msxtool\Release\msxtool.exe bas2cas examples\HELLO.bas -o "%W%\HELLO.cas" --name HELLO
          if errorlevel 1 exit /b 1
          build-win\tools\msxtool\Release\msxtool.exe cas2wav "%W%\HELLO.cas" -o "%W%\HELLO.wav" --baud 2400 --volume 60
          if errorlevel 1 exit /b 1
          build-win\tools\msxtool\Release\msxtool.exe normalize "%W%\HELLO.wav" -o "%W%\HELLO.normalized.wav"
          if errorlevel 1 exit /b 1
          build-win\tools\msxtool\Release\msxtool.exe wav2cas "%W%\HELLO.normalized.wav" -o "%W%\HELLO2.cas"
          if errorlevel 1 exit /b 1
          build-win\tools\msxtool\Release\msxtool.exe cas2bas "%W%\HELLO2.cas" -o "%W%\HELLO2.bas"
          if errorlevel 1 exit /b 1
          build-win\tools\msxtool\Release\msxtool.exe tokenize examples\HELLO.bas -o "%W%\A.bin"
          if errorlevel 1 exit /b 1
          build-win\tools\msxtool\Release\msxtool.exe tokenize "%W%\HELLO2.bas" -o "%W%\B.bin"
          if errorlevel 1 exit /b 1
          fc /b "%W%\A.bin" "%W%\B.bin" >nul
          if errorlevel 1 exit /b 1

      - name: Package
        shell: pwsh
        run: |
          $stage = "stage/MX-Studio"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build-win/app/win32/Release/msxstudio.exe $stage
          Copy-Item build-win/tools/msxtool/Release/msxtool.exe $stage
          Copy-Item -Recurse examples, docs, scripts $stage
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.txt, README.md $stage
          Compress-Archive -Path $stage -DestinationPath MX-Studio-win32.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MX-Studio-win32
          path: MX-Studio-win32.zip
          if-no-files-found: error

  windows-xp:
    name: Windows XP (MSVC v141_xp)
    # The v141_xp toolset has to be installed first, which takes several
    # minutes, so this job runs for releases and manual dispatches only.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install the v141_xp toolset
        shell: pwsh
        run: |
          $installPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          $argLine = 'modify --installPath "' + $installPath + '"' +
            ' --add Microsoft.VisualStudio.Component.VC.v141.x86.x64' +
            ' --add Microsoft.VisualStudio.Component.WinXP' +
            ' --quiet --norestart --nocache'
          Write-Host "vs_installer $argLine"
          $p = Start-Process -FilePath $installer -ArgumentList $argLine -Wait -PassThru
          Write-Host "vs_installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "vs_installer failed with $($p.ExitCode)"
          }

          $deadline = (Get-Date).AddMinutes(20)
          while ($true) {
            $msvc = Get-ChildItem "$installPath\VC\Tools\MSVC" -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like '14.16.*' }
            $props = Test-Path "$installPath\VC\VCTargets\Platforms\Win32\PlatformToolsets\v141_xp\Toolset.props"
            if ($msvc -or $props) { Write-Host "v141 toolset found"; break }
            if ((Get-Date) -gt $deadline) { throw "v141_xp toolset was not installed" }
            Start-Sleep -Seconds 15
          }

      - name: Build
        shell: cmd
        env:
          MSX_VS_GENERATOR: Visual Studio 17 2022
        run: scripts\build-msvc-xp.bat

      - name: Verify XP imports
        shell: cmd
        run: |
          scripts\check-xp-binary.bat
          if errorlevel 1 exit /b 1
          scripts\check-xp-binary.bat build-win-xp\tools\msxtool\Release\msxtool.exe
          if errorlevel 1 exit /b 1

      - name: Smoke test
        shell: cmd
        run: scripts\smoke-test.bat

      - name: Package
        shell: pwsh
        run: |
          $stage = "stage-xp/MX-Studio"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build-win-xp/app/win32/Release/msxstudio.exe $stage
          Copy-Item build-win-xp/tools/msxtool/Release/msxtool.exe $stage
          Copy-Item -Recurse examples, docs, scripts $stage
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.txt, README.md $stage
          Compress-Archive -Path $stage -DestinationPath MX-Studio-win32-xp.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MX-Studio-win32-xp
          path: MX-Studio-win32-xp.zip
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, windows-xp]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MX-Studio-win32
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: MX-Studio-win32-xp
          path: dist

      - name: Rename assets
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mv "dist/MX-Studio-win32.zip" "dist/MX-Studio-${VER}-win32.zip"
          mv "dist/MX-Studio-win32-xp.zip" "dist/MX-Studio-${VER}-win32-xp.zip"
          ls -l dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
